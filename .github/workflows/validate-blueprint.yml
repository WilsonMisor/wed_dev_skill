name: Validate AI Product Delivery Blueprint

on:
  push:
    branches:
      - "integration/preos-production-assurance"
      - "upgrade/ai-product-delivery-blueprint"
      - "upgrade/source-intake-continuity"
      - "fix/master-plan-extraction-remediation"
      - "main"
      - "pasv2/final-residual-remediation"
  pull_request:
    branches:
      - "upgrade/ai-product-delivery-blueprint"
      - "main"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wed_dev_skill
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: wed_dev_skill

      - name: Check out compatible PREOS
        uses: actions/checkout@v4
        with:
          repository: WilsonMisor/PREOS
          ref: pasv2/final-residual-remediation
          path: PREOS
          fetch-depth: 0

      - name: Check out compatible specialist workforce
        uses: actions/checkout@v4
        with:
          repository: WilsonMisor/gstack
          ref: pasv2/final-residual-remediation
          path: gstack
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Materialize specialist distribution before suite tests
        working-directory: gstack
        run: |
          bun install --frozen-lockfile
          python scripts/build_codex_distribution.py

      - name: Fetch main baseline
        run: git fetch origin main:refs/remotes/origin/main

      - name: Validate blueprint manifest, PREOS integration and preservation
        run: python3 scripts/validate_blueprint.py

      - name: Validate automatic source semantic extraction contract
        run: python3 scripts/validate_source_semantics.py

      - name: Validate Codex distribution freshness
        run: python3 scripts/build_codex_distribution.py --check

      - name: Run Blueprint unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
