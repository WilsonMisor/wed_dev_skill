name: One-shot Phase 4 master-plan closure

on:
  push:
    branches:
      - upgrade/source-intake-continuity

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upgrade/source-intake-continuity
          fetch-depth: 0

      - name: Apply only Phase 4 master-plan omissions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/source_intake.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'PROJECT_MODES = {"GREENFIELD", "BROWNFIELD", "HYBRID_OR_MIGRATION", "UNKNOWN"}\n'
          replacement = anchor + 'AUTHORITATIVE_SOURCE_AUTHORITIES = {"HUMAN_APPROVED", "DECLARED_PRIMARY", "APPROVED_SUPPORTING"}\n'
          if text.count(anchor) != 1 or 'AUTHORITATIVE_SOURCE_AUTHORITIES' in text:
              raise SystemExit('source_intake.py authority anchor drifted or patch already present')
          text = text.replace(anchor, replacement, 1)

          anchor = '\ndef assign_ids(records: list[dict]) -> None:\n'
          drift_fn = r'''

def detect_source_hash_drift(previous_records: list[dict], current_records: list[dict]) -> list[dict]:
    """Detect changed/missing previously-authoritative sources without guessing resolution."""
    previous = {
        str(record.get("path")): record
        for record in previous_records
        if record.get("path") and record.get("authority") in AUTHORITATIVE_SOURCE_AUTHORITIES
    }
    current = {str(record.get("path")): record for record in current_records if record.get("path")}
    drift: list[dict] = []
    for source_path, prior in sorted(previous.items()):
        now = current.get(source_path)
        prior_hash = str(prior.get("sha256") or "")
        if now is None:
            drift.append({
                "path": source_path,
                "authority": prior.get("authority"),
                "state": "MISSING_AUTHORITATIVE_SOURCE",
                "previous_sha256": prior_hash,
                "current_sha256": None,
                "impact_analysis_required": True,
                "blocking": True,
            })
            continue
        current_hash = str(now.get("sha256") or "")
        if current_hash != prior_hash:
            drift.append({
                "path": source_path,
                "authority": prior.get("authority"),
                "state": "CHANGED_AUTHORITATIVE_SOURCE",
                "previous_sha256": prior_hash,
                "current_sha256": current_hash,
                "impact_analysis_required": True,
                "blocking": True,
            })
    return drift
'''
          if text.count(anchor) != 1 or 'def detect_source_hash_drift' in text:
              raise SystemExit('source_intake.py assign_ids anchor drifted or drift function already present')
          text = text.replace(anchor, drift_fn + anchor, 1)

          anchor = '\ndef main() -> None:\n'
          loader = r'''

def load_baseline_sources(path: str | None) -> list[dict]:
    if not path:
        return []
    data = json.loads(Path(path).expanduser().read_text(encoding="utf-8"))
    if not isinstance(data, dict) or not isinstance(data.get("sources"), list):
        raise ValueError("baseline manifest must be a JSON object containing a sources array")
    return data["sources"]
'''
          if text.count(anchor) != 1 or 'def load_baseline_sources' in text:
              raise SystemExit('source_intake.py main anchor drifted or baseline loader already present')
          text = text.replace(anchor, loader + anchor, 1)

          anchor = '    ap.add_argument("--decisions", help="Optional governed JSON decisions for authority/supersession/conflicts/requirements/architecture/stack")\n'
          replacement = anchor + '    ap.add_argument("--baseline-manifest", help="Optional immutable prior source-manifest.json used to detect authoritative source-hash drift")\n'
          if text.count(anchor) != 1:
              raise SystemExit('source_intake.py decisions argument anchor drifted')
          text = text.replace(anchor, replacement, 1)

          anchor = '    output_root.mkdir(parents=True, exist_ok=True)\n\n    staging = None\n'
          replacement = '''    output_root.mkdir(parents=True, exist_ok=True)\n\n    baseline_path = Path(args.baseline_manifest).expanduser().resolve() if args.baseline_manifest else None\n    output_manifest = (output_root / "source-manifest.json").resolve()\n    if baseline_path is not None and baseline_path == output_manifest:\n        raise ValueError("baseline manifest must be immutable and separate from the output source-manifest.json")\n\n    staging = None\n'''
          if text.count(anchor) != 1:
              raise SystemExit('source_intake.py output-root anchor drifted')
          text = text.replace(anchor, replacement, 1)

          anchor = '    if project_mode not in PROJECT_MODES:\n        raise SystemExit(f"invalid governed project mode: {project_mode}")\n\n    intake = {\n'
          replacement = '''    if project_mode not in PROJECT_MODES:\n        raise SystemExit(f"invalid governed project mode: {project_mode}")\n\n    baseline_sources = load_baseline_sources(str(baseline_path) if baseline_path else None)\n    source_drift = detect_source_hash_drift(baseline_sources, records)\n\n    intake = {\n'''
          if text.count(anchor) != 1:
              raise SystemExit('source_intake.py project-mode anchor drifted')
          text = text.replace(anchor, replacement, 1)

          anchor = '        "version_candidate_groups": build_version_candidate_groups(records),\n        "source_conflicts": conflicts,\n'
          replacement = '        "version_candidate_groups": build_version_candidate_groups(records),\n        "source_conflicts": conflicts,\n        "source_drift": source_drift,\n'
          if text.count(anchor) != 1:
              raise SystemExit('source_intake.py intake drift anchor drifted')
          text = text.replace(anchor, replacement, 1)

          anchor = '        "version_candidate_groups": intake["version_candidate_groups"],\n    })\n'
          replacement = '        "version_candidate_groups": intake["version_candidate_groups"],\n        "source_drift": intake["source_drift"],\n    })\n'
          if text.count(anchor) != 1:
              raise SystemExit('source_intake.py manifest anchor drifted')
          text = text.replace(anchor, replacement, 1)

          anchor = '        f"Version candidate groups: **{len(intake[\'version_candidate_groups\'])}**",\n        f"Blocking source conflicts: **{len(blocking)}**",\n'
          replacement = '        f"Version candidate groups: **{len(intake[\'version_candidate_groups\'])}**",\n        f"Blocking source conflicts: **{len(blocking)}**",\n        f"Authoritative source drift items: **{len(intake.get(\'source_drift\', []))}**",\n'
          if text.count(anchor) != 1:
              raise SystemExit('source_intake.py summary count anchor drifted')
          text = text.replace(anchor, replacement, 1)

          anchor = '    lines += ["", "## Conflicts", ""]\n'
          replacement = '''    lines += ["", "## Source drift", ""]\n    drift = intake.get("source_drift", [])\n    if drift:\n        lines += [f"- {item['state']} `{item['path']}` requires downstream impact analysis before affected work advances." for item in drift]\n    else:\n        lines += ["- No authoritative source-hash drift detected against the supplied baseline manifest."]\n    lines += ["", "## Conflicts", ""]\n'''
          if text.count(anchor) != 1:
              raise SystemExit('source_intake.py summary section anchor drifted')
          text = text.replace(anchor, replacement, 1)

          anchor = '    blocking = [c for c in conflicts if c.get("blocking")]\n    status = "SOURCE_INTAKE_BLOCKED" if blocking else "SOURCE_INTAKE_COMPLETE"\n'
          replacement = '    blocking = [c for c in conflicts if c.get("blocking")]\n    status = "SOURCE_INTAKE_BLOCKED" if blocking or source_drift else "SOURCE_INTAKE_COMPLETE"\n'
          if text.count(anchor) != 1:
              raise SystemExit('source_intake.py status anchor drifted')
          text = text.replace(anchor, replacement, 1)

          anchor = '        "blocking_conflicts": len(blocking),\n    }, indent=2))\n    if blocking:\n        raise SystemExit(2)\n'
          replacement = '        "blocking_conflicts": len(blocking),\n        "source_drift": len(source_drift),\n    }, indent=2))\n    if blocking or source_drift:\n        raise SystemExit(2)\n'
          if text.count(anchor) != 1:
              raise SystemExit('source_intake.py final status anchor drifted')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_source_intake.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    def test_zip_traversal_is_rejected(self):\n'
          tests = r'''    def test_safe_zip_extracts_without_mutating_original_source(self):
        with tempfile.TemporaryDirectory() as td:
            root = Path(td)
            z = root / "safe.zip"
            staging = root / "staging"
            with zipfile.ZipFile(z, "w") as zf:
                zf.writestr("docs/requirements.md", "approved source bytes")
            before = MOD.sha256_file(z)
            records, warnings = MOD.inspect_zip(z, staging)
            after = MOD.sha256_file(z)
            self.assertEqual(warnings, [])
            self.assertEqual(before, after)
            self.assertEqual(records[0]["path"], "docs/requirements.md")
            self.assertEqual((staging / "docs" / "requirements.md").read_text(encoding="utf-8"), "approved source bytes")

'''
          if text.count(anchor) != 1 or 'test_safe_zip_extracts_without_mutating_original_source' in text:
              raise SystemExit('test_source_intake.py safe ZIP anchor drifted or test already present')
          text = text.replace(anchor, tests + anchor, 1)

          anchor = '    def test_directory_symlink_is_skipped_not_followed(self):\n'
          test = r'''    def test_zip_reparse_or_junction_entry_is_rejected(self):
        with tempfile.TemporaryDirectory() as td:
            z = Path(td) / "bad-reparse.zip"
            info = zipfile.ZipInfo("junction")
            info.external_attr = 0x0400
            with zipfile.ZipFile(z, "w") as zf:
                zf.writestr(info, "target")
            with self.assertRaises(ValueError):
                MOD.inspect_zip(z)

'''
          if text.count(anchor) != 1 or 'test_zip_reparse_or_junction_entry_is_rejected' in text:
              raise SystemExit('test_source_intake.py reparse anchor drifted or test already present')
          text = text.replace(anchor, test + anchor, 1)

          anchor = '    def test_stable_requirement_ids_do_not_depend_on_input_order(self):\n'
          test = r'''    def test_authoritative_source_hash_drift_detects_changed_and_missing_sources(self):
        previous = [
            {"path": "requirements.md", "sha256": "a" * 64, "authority": "HUMAN_APPROVED"},
            {"path": "architecture.md", "sha256": "b" * 64, "authority": "DECLARED_PRIMARY"},
            {"path": "notes.md", "sha256": "c" * 64, "authority": "DRAFT_REFERENCE_HISTORY"},
        ]
        current = [
            {"path": "requirements.md", "sha256": "d" * 64, "authority": "UNCLASSIFIED"},
            {"path": "notes.md", "sha256": "e" * 64, "authority": "UNCLASSIFIED"},
        ]
        drift = MOD.detect_source_hash_drift(previous, current)
        self.assertEqual([item["path"] for item in drift], ["architecture.md", "requirements.md"])
        self.assertEqual(drift[0]["state"], "MISSING_AUTHORITATIVE_SOURCE")
        self.assertEqual(drift[1]["state"], "CHANGED_AUTHORITATIVE_SOURCE")
        self.assertTrue(all(item["impact_analysis_required"] and item["blocking"] for item in drift))
        self.assertNotIn("notes.md", [item["path"] for item in drift])

'''
          if text.count(anchor) != 1 or 'test_authoritative_source_hash_drift_detects_changed_and_missing_sources' in text:
              raise SystemExit('test_source_intake.py source-drift anchor drifted or test already present')
          text = text.replace(anchor, test + anchor, 1)

          anchor = '    def test_invalid_authority_is_rejected(self):\n'
          tests = r'''    def test_architecture_extraction_contract_preserves_observed_declared_approved(self):
        payload = {
            "observed_architecture": {"frontend": "server-rendered", "database": "PostgreSQL"},
            "declared_architecture": {"frontend": "web", "database": "PostgreSQL"},
            "approved_architecture": {"frontend": "server-rendered", "database": "PostgreSQL", "trust_boundaries": ["public", "admin"]},
        }
        self.assertEqual(MOD._object(payload, "observed_architecture")["frontend"], "server-rendered")
        self.assertEqual(MOD._object(payload, "declared_architecture")["frontend"], "web")
        self.assertEqual(MOD._object(payload, "approved_architecture")["trust_boundaries"], ["public", "admin"])

    def test_stack_extraction_contract_preserves_observed_declared_approved(self):
        payload = {
            "observed_stack": {"language": "PHP", "package_manager": "Composer"},
            "declared_stack": {"language": "PHP"},
            "approved_stack": {"language": "PHP 8.3", "package_manager": "Composer"},
        }
        self.assertEqual(MOD._object(payload, "observed_stack")["package_manager"], "Composer")
        self.assertEqual(MOD._object(payload, "declared_stack")["language"], "PHP")
        self.assertEqual(MOD._object(payload, "approved_stack")["language"], "PHP 8.3")

'''
          if text.count(anchor) != 1 or 'test_architecture_extraction_contract_preserves_observed_declared_approved' in text:
              raise SystemExit('test_source_intake.py extraction anchor drifted or tests already present')
          text = text.replace(anchor, tests + anchor, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('orchestration/source-intake.md')
          text = path.read_text(encoding='utf-8')
          old = 'The deterministic helper `scripts/source_intake.py` inventories files, computes SHA-256 hashes, detects exact duplicates and filename-version **candidates**, classifies greenfield/brownfield evidence, and safely stages a ZIP.'
          new = 'The deterministic helper `scripts/source_intake.py` inventories files, computes SHA-256 hashes, detects exact duplicates and conservative filename-version/revision **candidates**, classifies greenfield/brownfield evidence, and safely stages a ZIP. Version candidates are the conservative near-duplicate/revision signal; they never establish byte equivalence, authority, or supersession.'
          if text.count(old) != 1:
              raise SystemExit('source-intake.md helper description anchor drifted')
          text = text.replace(old, new, 1)
          old = 'Bind authoritative intake sources by hash. When a bound source changes, perform impact analysis across affected PRD/SRS/SRD requirements, architecture, ADRs, risks, controls, AI Task Packets, tests, evidence, monitoring, recovery/reconciliation, and production gates. Materially affected evidence becomes stale until revalidated.'
          new = old + '\n\nFor deterministic re-intake, supply an immutable prior `source-manifest.json` through `--baseline-manifest`. The helper compares previously `HUMAN_APPROVED`, `DECLARED_PRIMARY`, and `APPROVED_SUPPORTING` source hashes, reports changed or missing authoritative sources, and blocks affected downstream work until the required impact analysis is completed. The baseline manifest must be separate from the output manifest so drift evidence cannot overwrite its own comparison baseline.'
          if text.count(old) != 1:
              raise SystemExit('source-intake.md drift anchor drifted')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('orchestration/upgrade-reconciliation.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '| Safe archive extraction | gstack | MOVE_TO_BLUEPRINT | Blueprint | ZIP staging | Implemented | traversal/absolute/symlink/reparse/overwrite checks |': '| Safe archive extraction | gstack | MOVE_TO_BLUEPRINT | Blueprint | ZIP staging | Implemented | positive safe-ZIP/original-preservation test + traversal/absolute/symlink/reparse checks |',
              '| Architecture extraction | gstack | MOVE_TO_BLUEPRINT | Blueprint | observed/declared/approved architecture | Implemented contract | source-intake tests + validator |': '| Architecture extraction | gstack | MOVE_TO_BLUEPRINT | Blueprint | observed/declared/approved architecture | Implemented extraction contract | explicit observed/declared/approved architecture test + validator |',
              '| Stack extraction | gstack | MOVE_TO_BLUEPRINT | Blueprint | observed/declared/approved stack | Implemented contract | source-intake tests + validator |': '| Stack extraction | gstack | MOVE_TO_BLUEPRINT | Blueprint | observed/declared/approved stack | Implemented extraction contract | explicit observed/declared/approved stack test + validator |',
              '| Source drift | gstack | STRENGTHEN | Blueprint + PREOS | source hashes + change impact/evidence freshness | Implemented contract | Blueprint validator + PREOS recovery drift test |': '| Source drift | gstack | STRENGTHEN | Blueprint + PREOS | source hashes + change impact/evidence freshness | Implemented deterministic detection + PREOS change-impact contract | authoritative source-hash drift test + Blueprint validator + PREOS recovery drift test |',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'upgrade-reconciliation row drifted: {old[:60]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('scripts/validate_blueprint.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    for token in ["SHA-256", "SOURCE CONFLICT", "UNCLASSIFIED", "safe", ".ai-product-delivery/source-intake/", "PREOS project-init"]:\n'
          replacement = '    for token in ["SHA-256", "SOURCE CONFLICT", "UNCLASSIFIED", "safe", ".ai-product-delivery/source-intake/", "PREOS project-init", "--baseline-manifest"]:\n'
          if text.count(anchor) != 1:
              raise SystemExit('validate_blueprint.py source-intake token anchor drifted')
          text = text.replace(anchor, replacement, 1)
          anchor = '    for token in ["Conversation memory is never authoritative execution state", "PREOS_STATE_ROOT", "RECOVERY_CONFLICT", "first unverified action", "gstack semantic context"]:\n'
          insertion = '    script_text = SOURCE_INTAKE_SCRIPT.read_text(encoding="utf-8")\n    for token in ["detect_source_hash_drift", "--baseline-manifest", "CHANGED_AUTHORITATIVE_SOURCE", "MISSING_AUTHORITATIVE_SOURCE"]:\n        if token not in script_text:\n            fail(f"source-intake helper missing source-drift implementation anchor: {token}")\n'
          if text.count(anchor) != 1 or 'source-drift implementation anchor' in text:
              raise SystemExit('validate_blueprint.py continuity anchor drifted or drift validator already present')
          text = text.replace(anchor, insertion + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Enforce bounded Phase 4 file surface
        shell: bash
        run: |
          set -euo pipefail
          expected=$'orchestration/source-intake.md\norchestration/upgrade-reconciliation.md\nscripts/source_intake.py\nscripts/validate_blueprint.py\ntests/test_source_intake.py'
          changed="$(git diff --name-only | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Run complete Blueprint tests and validator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_blueprint.py

      - name: Commit validated Phase 4 closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WilsonMisor'
          git config user.email '100686890+WilsonMisor@users.noreply.github.com'
          git add orchestration/source-intake.md orchestration/upgrade-reconciliation.md scripts/source_intake.py scripts/validate_blueprint.py tests/test_source_intake.py
          git commit -m 'Close Blueprint Phase 4 source-intake gaps'
          git push origin HEAD:upgrade/source-intake-continuity
